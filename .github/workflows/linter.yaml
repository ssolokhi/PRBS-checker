name: Linter
run-name: Linter triggered by ${{ github.event_name }}

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install verilator
        run: sudo apt update && sudo apt install -y verilator

      - name: Run verilator
        run: verilator --lint-only -Wall --bbox-unsup --timing --top-module prbs_checker_top src/*.sv sim/*.sv